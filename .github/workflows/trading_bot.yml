name: QuantumTrader AI Bot V9

on:
  schedule:
    # Escaneo de Alta Frecuencia: Despierta cada 15 minutos (00, 15, 30, 45) de 14:00 a 21:59 UTC (Lun-Vie)
    - cron: '*/15 14-21 * * 1-5'
  workflow_dispatch: # Permite ejecutarlo manualmente con el botón en GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        # Sin caché para evitar la guerra de dependencias

    - name: Instalar Infraestructura Cuantitativa
      run: |
        python -m pip install --upgrade pip
        
        # 1. Congelar yfinance para proteger WebSockets
        pip install yfinance==0.2.31
        
        # 2. Librerías Core, API Broker y Variables de Entorno
        pip install pandas requests matplotlib scikit-learn xgboost joblib alpaca-trade-api python-dotenv
        
        # 3. Deep Learning (TensorFlow CPU)
        pip install tensorflow-cpu
        
        # 4. Procesamiento de Lenguaje (Torch CPU y Transformers)
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install transformers

    - name: Ejecutar Orquestador V9
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        ALPACA_BASE_URL: https://api.alpaca.markets
      run: python main.py

    - name: Empaquetar y Transmitir Telemetría a GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # El comodín universal: atrapa TODOS los archivos modificados o creados (CSV, PNG, etc.)
        git add .
        
        # Ejecuta el commit solo si hay cambios reales. Si no los hay, ignora el error y avanza.
        git commit -m "🤖 Actualización V9: Barrido de IA, Operaciones en Vivo y Ledger" || echo "No changes to commit"
        
        # Sincroniza líneas de tiempo (por si editaste código localmente) y sube todo a la nube
        git pull --rebase origin main
        git push origin main
